<!doctype html><html lang="de"><head><meta charset="utf-8"><title>TikTok OAuth Callback</title></head><body style="font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px;"><h1>TikTok-Autorisierung</h1><p>Kopiere den <code>code</code>-Wert unten und fuehre ihn lokal aus:</p><pre id="cmd" style="background:#eee; padding:12px; white-space:pre-wrap; word-break:break-all;"></pre><p id="raw" style="color:#666; font-size:14px;"></p><script>var params=new URLSearchParams(window.location.search);var code=params.get("code");var error=params.get("error_description")||params.get("error");var cmdEl=document.getElementById("cmd");var rawEl=document.getElementById("raw");if(code){cmdEl.textContent="node scripts/tiktok-oauth.js exchange "+code;}else if(error){cmdEl.textContent="Fehler: "+error;}else{cmdEl.textContent="Kein code-Parameter in der URL gefunden.";}rawEl.textContent="Vollstaendige URL (zur Kontrolle): "+window.location.href;</script></body></html>
